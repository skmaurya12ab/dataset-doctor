# ==============================================================================
# Dataset Doctor — Production Docker Compose Specification
# Single-replica backend constraint enforced until distributed task queue is added
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: dataset_doctor_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      POSTGRES_DB: ${POSTGRES_DB:-dataset_doctor}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dataset_doctor}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dataset_doctor_internal

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend Application (Single Replica Constraint)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataset_doctor_prod_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "Dataset Doctor"
      ENVIRONMENT: "production"
      DEBUG: "false"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dataset_doctor}"
      UPLOAD_DIR: "/app/uploads"
      MAX_UPLOAD_SIZE_MB: "100"
      MAX_DATASETS_PER_USER: "${MAX_DATASETS_PER_USER:-20}"
      MAX_CUMULATIVE_STORAGE_MB_PER_USER: "${MAX_CUMULATIVE_STORAGE_MB_PER_USER:-500}"
      MAX_CONCURRENT_ANALYSIS_JOBS_PER_USER: "${MAX_CONCURRENT_ANALYSIS_JOBS_PER_USER:-2}"
      LOG_LEVEL: "INFO"
      MAX_WORKER_THREADS: "4"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o-2024-08-06}"
      SESSION_COOKIE_NAME: "dd_session"
      SESSION_MAX_AGE_SECONDS: "604800"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: "lax"
      REQUIRE_EMAIL_VERIFICATION: "${REQUIRE_EMAIL_VERIFICATION:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost,https://datasetdoctor.com}"
      ENABLE_API_DOCS: "${ENABLE_API_DOCS:-false}"
      TRUSTED_PROXIES: "127.0.0.1,::1,proxy"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_TLS: "${SMTP_TLS:-true}"
      EMAIL_FROM: "${EMAIL_FROM:-noreply@datasetdoctor.com}"
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dataset_doctor_internal

  # ----------------------------------------------------------------------------
  # 3. Nginx Ingress & SPA Reverse Proxy
  # ----------------------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: dataset_doctor_prod_proxy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - dataset_doctor_internal

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  pg_data:
    driver: local
  uploads_data:
    driver: local

networks:
  dataset_doctor_internal:
    driver: bridge
