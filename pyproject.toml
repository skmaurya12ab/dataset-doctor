[project]
name = "dataset-doctor"
version = "0.1.0"
description = "AI-assisted data quality and ML-readiness platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dataset Doctor Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.1.1",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "pyarrow>=18.0.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.18",
    "openai>=1.60.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
