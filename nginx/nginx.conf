# ==============================================================================
# Dataset Doctor — Production Reverse Proxy & Ingress Configuration (Nginx)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression for fast asset transfers
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Ingress Rate Limiting: 30 requests/second per IP with burst allowance
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;
    limit_req_status 429;

    # Upstream FastAPI application (single replica)
    upstream dataset_doctor_backend {
        server api:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Maximum payload size aligned with MAX_UPLOAD_SIZE_MB (100 MB)
        client_max_body_size 100M;

        # Root directory for pre-built React SPA production bundle
        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------------------------
        # 1. API Reverse Proxy & Rate Limiting
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_rate_limit burst=20 nodelay;

            proxy_pass http://dataset_doctor_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Crucial trusted proxy headers (prevents spoofing when Nginx is front ingress)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for heavy analytical queries
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ----------------------------------------------------------------------
        # 2. System Health & Readiness Probes
        # ----------------------------------------------------------------------
        location = /health {
            proxy_pass http://dataset_doctor_backend/health;
            proxy_set_header Host $host;
        }

        location = /ready {
            proxy_pass http://dataset_doctor_backend/ready;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------------------------
        # 3. Static Assets Caching (Vite hashed bundles)
        # ----------------------------------------------------------------------
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ----------------------------------------------------------------------
        # 4. Frontend Single-Page Application (SPA) Fallback
        # ----------------------------------------------------------------------
        location / {
            # Enables seamless refresh on nested client-side routes (e.g. /datasets/uuid, /login)
            try_files $uri $uri/ /index.html;
        }
    }
}
